name: Update plane data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-plane-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/fetch-planes.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/planes.json /tmp/planes.json

          # 1分おきの実行同士が同じファイルを取り合うため、rebase/mergeは使わない。
          # 常にリモート最新コミットの上に、自分が取得した内容を乗せ直して再試行する。
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/planes.json data/planes.json
            git add data/planes.json
            if git diff --cached --quiet; then
              echo "no changes"
              exit 0
            fi
            git commit -m "chore: update plane data"
            if git push; then
              exit 0
            fi
            sleep 2
          done
          echo "failed to push after retries"
          exit 1
