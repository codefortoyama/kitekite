name: Prepare AI airport topic suggestions

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-airport-topic-suggestions
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate review candidates from official airport RSS
        id: collect
        env:
          ASSISTANT_BASE_URL: ${{ vars.ASSISTANT_BASE_URL || 'https://opencode.ai/inference/go/openai/v1' }}
          ASSISTANT_API_KEY: ${{ secrets.ASSISTANT_API_KEY || secrets.OPENCODE_GO_API_KEY }}
          ASSISTANT_MODEL: ${{ vars.ASSISTANT_MODEL || 'deepseek-v4.1-flash' }}
          ASSISTANT_TIMEOUT_SEC: ${{ vars.ASSISTANT_TIMEOUT_SEC || '30' }}
          ASSISTANT_SESSION_HEADER: ${{ vars.ASSISTANT_SESSION_HEADER || 'x-opencode-session' }}
          AI_TOPIC_OUTPUT_PATH: js/ai-topics.js
        run: node scripts/collect-ai-topics.mjs

      - name: Open or update review pull request
        if: steps.collect.outputs.has_candidates == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/ai-airport-topic-candidates
          delete-branch: true
          add-paths: js/ai-topics.js
          commit-message: "chore: prepare AI airport topic candidates"
          title: "AIおすすめ情報の掲載候補を確認"
          body: |
            富山空港の公式RSSをAIで要約した掲載候補です。

            公開前に、事実・対象条件・掲載日・出典リンクを確認してください。
            このPRは自動マージされません。承認してマージするとトップのカルーセルに掲載されます。
